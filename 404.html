<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Gyans</title>
  <script type="text/javascript">
    // Single Page Application Router for GitHub Pages
    (function() {
      var l = window.location;
      var path = l.pathname.replace(/^\/+|\/+$/g, '').toLowerCase();
      var query = l.search ? l.search.slice(1) : '';
      var hash = l.hash;

      var origin = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '');
      var redirectUrl = origin + '/';

      if (path === 'terms' || path === 'privacy' || path === 'dmca') {
        redirectUrl += '?tab=' + path + (hash ? hash : '');
      } else if (path) {
        redirectUrl += '?route=' + encodeURIComponent(path) + (query ? '&' + query : '') + (hash ? hash : '');
      }

      window.location.replace(redirectUrl);
    })();
  </script>
</head>
<body style="background-color: #090d16; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 0;">
  <div style="text-align: center;">
    <div style="width: 40px; height: 40px; border: 3px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px auto;"></div>
    <p style="font-size: 15px; color: #94a3b8; font-weight: 500; margin: 0;">Loading Virtual Gyans...</p>
  </div>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
